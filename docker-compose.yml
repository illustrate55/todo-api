services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
      build: .
      command: alembic upgrade head
      environment:
        DATABASE_URL: postgresql+psycopg://todo:todo@db:5432/todo
      depends_on:
        db:
          condition: service_healthy

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://todo:todo@db:5432/todo
      JWT_SECRET: super-secret-key-change-in-prod
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: